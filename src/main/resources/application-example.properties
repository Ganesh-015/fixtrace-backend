# FixTrace Example Configuration
# Copy this file to application-local.properties or set the corresponding environment variables.

server.port=8080

# MySQL Database Setup
# Set via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/fixtrace_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Secret & Expiration (Provide a 256-bit / 32-byte hex or base64 key)
# Set via environment variables: JWT_SECRET, JWT_EXPIRATION_MS
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Development Seed Data (set to false in production)
app.seed.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
